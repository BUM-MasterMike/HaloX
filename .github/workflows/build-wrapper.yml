name: Build HaloX Wrapper

# Manual trigger only. Version is read from the topmost CHANGELOG.md section.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build. 'all' = Intel + Apple Silicon + Linux (default); 'intel'/'silicon' = a single macOS platform; 'linux' = the Linux wrapper (ubuntu-latest, x86_64). Pick a single platform when the -vidmode settings differ per machine (e.g. Intel without vidmode, Silicon with a preset)."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - intel
          - silicon
          - linux
      game_zip_url:
        description: "[macOS+Linux] Optional URL to a zip of the installed Halo folder; used instead of ./game"
        required: false
        default: ""
      engine:
        description: "[macOS] Wine engine to use. WineskinCX 23.7.1 (WS11) is the verified engine for Halo (Gcenx Wine 11 does not work); other WS11 WineskinCX versions can be tested. Ignored for platform 'linux' (which always uses the latest Kron4ek wow64 engine)."
        required: false
        default: "wineskincx-23.7.1"
        type: choice
        options:
          - wineskincx-23.7.1
          - wineskincx-23.6.0
          - wineskincx-23.5.0
          - wineskincx-22.1.1
          - wineskincx-21.2.0
      engine_url:
        description: "[macOS] Optional direct URL to a WineskinCX engine archive (same wswine.bundle layout); overrides the 'engine' choice. Leave empty to use the chosen engine."
        required: false
        default: ""
      with_chimera:
        description: "[macOS+Linux] Whether to include Chimera in the build"
        required: false
        default: "true"
      with_dsoal:
        description: "[macOS+Linux] Whether to include DSOAL (3D audio) in the build"
        required: false
        default: "true"
      with_dxvk:
        description: "[Linux] Whether to include DXVK in the build (ignored on macOS)"
        required: false
        default: "true"
      dsoal:
        description: "[macOS+Linux] DSOAL source: bundle (checked-in tested build, default), github (latest daily build), or URL/path to a DSOAL archive"
        required: false
        default: "bundle"
      dsoal_hrtf:
        description: "[macOS+Linux] Force DSOAL binaural HRTF output (headphones)"
        required: false
        default: "false"
      moltenvk:
        description: "[macOS] MoltenVK version bundled for the optional vulkan per-run override (default 1.2.5; use 'none' to keep the engine's)"
        required: false
        default: "1.2.5"
      vidmode:
        description: "[macOS+Linux] Bundle a -vidmode value so the game starts at the current desktop resolution (wined3d skips the mode change). Needed on scaled 'Looks like' displays (e.g. MacBook Air) where Halo's first-run 640x480 mode change is refused (Direct3D error). 'none' = default build without -vidmode (Halo/Chimera handle the resolution). Preset aliases live in scripts/vidmode-presets.sh; 'custom' takes the vidmode_custom input."
        required: false
        default: "none"
        type: choice
        options:
          - none
          - macbook-air-13
          - macbook-air-13-max
          - macbook-air-13-old
          - macbook-air-13-old-max
          - macbook-air-15
          - macbook-air-15-max
          - macbook-pro-14
          - macbook-pro-14-max
          - macbook-pro-16
          - macbook-pro-16-max
          - custom
      vidmode_custom:
        description: "[macOS+Linux] Free-form W,H,R value (e.g. 1280,800,60) used when 'vidmode' is 'custom'. Leave empty for the default build."
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.os }} – ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 'matrix' is not available in jobs.<id>.if, so the platform filter
        # lives in the matrix itself: fromJSON + the 'platform' input.
        # 'all' builds Intel + Apple Silicon (.app) and Linux (wrapper dir);
        # 'linux' builds only the Linux wrapper (scripts/build-wrapper-linux.sh)
        # on ubuntu-latest; 'intel'/'silicon' build a single macOS .app.
        include: ${{ fromJSON(inputs.platform == 'all' && '[{"os":"macos-15-intel","arch":"x86_64","artifact":"HaloX-Intel"},{"os":"macos-latest","arch":"arm64","artifact":"HaloX-Silicon"},{"os":"ubuntu-latest","arch":"x86_64","artifact":"HaloX-Linux"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-latest","arch":"x86_64","artifact":"HaloX-Linux"}]' || inputs.platform == 'intel' && '[{"os":"macos-15-intel","arch":"x86_64","artifact":"HaloX-Intel"}]' || '[{"os":"macos-latest","arch":"arm64","artifact":"HaloX-Silicon"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from CHANGELOG
        run: |
          # Single source of truth: the topmost "## [x.y.z]" heading.
          VERSION="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from CHANGELOG.md (expected a '## [x.y.z]' heading)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # Halo game data is not redistributable. Provide it via a private
      # git-lfs/secret payload: game files are expected in ./game
      # (halo.exe + data). If you store them encrypted, decrypt here.
      - name: Fetch game files (private)
        run: |
          if [ -n "${{ inputs.game_zip_url }}" ]; then
            echo "Downloading game zip..."
            curl -L --fail -o Halo.zip "${{ inputs.game_zip_url }}"
            echo "Downloaded Halo.zip"
            if [ ! -f Halo.zip ]; then
              echo "::error::Failed to download game zip"
              exit 1
            fi
          elif [ -f game/halo.exe ] || [ -f game/haloce.exe ]; then
            echo "Game files present."
          else
            echo "::error::Missing game files – provide ./game or set inputs.game_zip_url."
            exit 1
          fi

      - name: Install WineskinCX engine + runtime
        if: runner.os == 'macOS'
        run: |
          set -e
          if [ "$(uname -m)" = "arm64" ]; then
            # The bundled engine is x86_64 -> make sure Rosetta 2 is present
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          mkdir -p "$RUNNER_TEMP/engine" "$RUNNER_TEMP/runtime"

          # Engine: either an explicit engine_url input or the engine choice.
          # WineskinCX 23.7.1 (WS11) is the version verified to run Halo
          # (Gcenx Wine 11 does not work: it crashes with data-cache errors).
          if [ -n "${{ inputs.engine_url }}" ]; then
            ENGINE_URL="${{ inputs.engine_url }}"
          else
            # Map the friendly engine name to the PortingKit archive name:
            #   wineskincx-23.7.1 -> WS11WineCX64Bit23.7.1.tar.7z
            case "${{ inputs.engine }}" in
              wineskincx-23.7.1) ENGINE_ARCHIVE="WS11WineCX64Bit23.7.1.tar.7z" ;;
              wineskincx-23.6.0) ENGINE_ARCHIVE="WS11WineCX64Bit23.6.0.tar.7z" ;;
              wineskincx-23.5.0) ENGINE_ARCHIVE="WS11WineCX64Bit23.5.0.tar.7z" ;;
              wineskincx-22.1.1) ENGINE_ARCHIVE="WS11WineCX64Bit22.1.1.tar.7z" ;;
              wineskincx-21.2.0) ENGINE_ARCHIVE="WS11WineCX64Bit21.2.0.tar.7z" ;;
              *) echo "::error::Unknown engine '${{ inputs.engine }}'"; exit 1 ;;
            esac
            ENGINE_URL="https://github.com/vitor251093/porting-kit-engines/releases/download/wineskin/${ENGINE_ARCHIVE}"
          fi
          echo "Downloading engine: $ENGINE_URL"
          curl -L --fail -o "$RUNNER_TEMP/engine/engine.tar.7z" "$ENGINE_URL"
          tar -xJf "$RUNNER_TEMP/engine/engine.tar.7z" -C "$RUNNER_TEMP/engine"

          # Locate the engine dir (wswine.bundle -> contains bin/ lib/ share/)
          ENGINE_DIR="$(dirname "$(find "$RUNNER_TEMP/engine" -maxdepth 3 -type d -name bin | head -1)")"
          test -x "$ENGINE_DIR/bin/wine64" || { echo "::error::Engine extraction: bin/wine64 not found in $ENGINE_DIR"; exit 1; }
          echo "Engine: $("$ENGINE_DIR/bin/wine64" --version 2>/dev/null || echo unknown)"

          # Runtime: the Wineskin wrapper template provides Contents/Frameworks
          # (shared libs the WineskinCX engine loads at runtime: MoltenVK, SDL2,
          # ICU, glib, ...). GStreamer.framework is excluded in build-wrapper.sh.
          RUNTIME_URL="https://github.com/The-Wineskin-Project/Wrapper/releases/download/v1.0/Wineskin-3.0.6_1.tar.7z"
          echo "Downloading Wineskin runtime: $RUNTIME_URL"
          curl -L --fail -o "$RUNNER_TEMP/runtime/runtime.tar.7z" "$RUNTIME_URL"
          tar -xJf "$RUNNER_TEMP/runtime/runtime.tar.7z" -C "$RUNNER_TEMP/runtime"

          # Locate the wrapper Contents dir (contains Frameworks/)
          RUNTIME_DIR="$(dirname "$(find "$RUNNER_TEMP/runtime" -maxdepth 4 -type d -name Frameworks | head -1)")"
          test -d "$RUNTIME_DIR/Frameworks" || { echo "::error::Runtime extraction: Frameworks/ not found"; exit 1; }
          echo "Runtime frameworks: $RUNTIME_DIR/Frameworks"

          echo "ENGINE_DIR=$ENGINE_DIR" >> "$GITHUB_ENV"
          echo "RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      # Linux: no Wineskin runtime; the Kron4ek wow64 engine is
      # self-contained (bin/ lib/ share/). 'latest' resolves to the newest
      # release via the shared github-latest-asset.sh helper (no python3).
      - name: Install tooling + Wine engine (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # bsdtar handles the .7z Chimera release archives (unzip covers .zip).
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          chmod +x scripts/github-latest-asset.sh
          mkdir -p "$RUNNER_TEMP/engine"
          ENGINE_URL="$(./scripts/github-latest-asset.sh Kron4ek/Wine-Builds '^wine-%s-amd64-wow64\.tar\.xz$')"
          echo "Downloading engine: $ENGINE_URL"
          curl -L --fail -o "$RUNNER_TEMP/engine/engine.tar.xz" "$ENGINE_URL"
          tar -xJf "$RUNNER_TEMP/engine/engine.tar.xz" -C "$RUNNER_TEMP/engine"

          # Locate the engine dir containing bin/ (wine / wine64).
          ENGINE_DIR="$(dirname "$(find "$RUNNER_TEMP/engine" -maxdepth 2 -type d -name bin | head -1)")"
          test -x "$ENGINE_DIR/bin/wine" || test -x "$ENGINE_DIR/bin/wine64" || {
            echo "::error::Engine extraction: bin/wine not found in $ENGINE_DIR"; exit 1
          }
          echo "Engine: $("$ENGINE_DIR/bin/wine" --version 2>/dev/null || echo unknown)"
          echo "ENGINE_DIR=$ENGINE_DIR" >> "$GITHUB_ENV"

      - name: Build wrapper (macOS)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/bash
          chmod +x scripts/build-wrapper.sh scripts/github-latest-asset.sh wrapper/HaloX-Launcher.sh
          GAME_ARG="./game"
          if [ -f Halo.zip ]; then
            GAME_ARG="./Halo.zip"
          fi
          BUILD_ARGS=()
          BUILD_ARGS+=(--engine "$ENGINE_DIR")
          BUILD_ARGS+=(--wineskin-runtime "$RUNTIME_DIR")
          BUILD_ARGS+=(--game "$GAME_ARG")
          BUILD_ARGS+=(--arch ${{ matrix.arch }})
          BUILD_ARGS+=(--out HaloX.app)
          BUILD_ARGS+=(--moltenvk "${{ inputs.moltenvk }}")
          if [ "${{ inputs.vidmode }}" = "custom" ]; then
            if [ -n "${{ inputs.vidmode_custom }}" ]; then
              BUILD_ARGS+=(--vidmode "${{ inputs.vidmode_custom }}")
            else
              echo "::warning::vidmode=custom but vidmode_custom is empty; building without -vidmode"
            fi
          elif [ "${{ inputs.vidmode }}" != "none" ]; then
            BUILD_ARGS+=(--vidmode "${{ inputs.vidmode }}")
          fi
          if [ "${{ inputs.with_chimera }}" = "true" ]; then
            BUILD_ARGS+=(--chimera github)
          fi
          if [ "${{ inputs.with_dsoal }}" = "true" ]; then
            BUILD_ARGS+=(--dsoal "${{ inputs.dsoal }}")
            if [ "${{ inputs.dsoal_hrtf }}" = "true" ]; then
              BUILD_ARGS+=(--dsoal-hrtf)
            fi
          fi
          ./scripts/build-wrapper.sh "${BUILD_ARGS[@]}"

      - name: Build wrapper (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/bash
          chmod +x scripts/build-wrapper-linux.sh wrapper/HaloX-Launcher-Linux.sh
          GAME_ARG="./game"
          if [ -f Halo.zip ]; then
            GAME_ARG="./Halo.zip"
          fi
          BUILD_ARGS=()
          BUILD_ARGS+=(--engine "$ENGINE_DIR")
          BUILD_ARGS+=(--game "$GAME_ARG")
          BUILD_ARGS+=(--arch ${{ matrix.arch }})
          BUILD_ARGS+=(--out dist/HaloX)
          if [ "${{ inputs.vidmode }}" = "custom" ]; then
            if [ -n "${{ inputs.vidmode_custom }}" ]; then
              BUILD_ARGS+=(--vidmode "${{ inputs.vidmode_custom }}")
            else
              echo "::warning::vidmode=custom but vidmode_custom is empty; building without -vidmode"
            fi
          elif [ "${{ inputs.vidmode }}" != "none" ]; then
            BUILD_ARGS+=(--vidmode "${{ inputs.vidmode }}")
          fi
          if [ "${{ inputs.with_chimera }}" = "true" ]; then
            BUILD_ARGS+=(--chimera github)
          fi
          if [ "${{ inputs.with_dsoal }}" = "true" ]; then
            BUILD_ARGS+=(--dsoal "${{ inputs.dsoal }}")
            if [ "${{ inputs.dsoal_hrtf }}" = "true" ]; then
              BUILD_ARGS+=(--dsoal-hrtf)
            fi
          fi
          if [ "${{ inputs.with_dxvk }}" = "true" ]; then
            BUILD_ARGS+=(--dxvk github)
          fi
          ./scripts/build-wrapper-linux.sh "${BUILD_ARGS[@]}"

      # upload-artifact does not preserve symlinks/permissions, which breaks
      # the ad-hoc signature of the .app (Gatekeeper: "damaged"). Package with
      # ditto first so the bundle survives intact. (Linux is packaged with
      # tar.gz, which preserves permissions natively.)
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -f "${{ matrix.artifact }}-v${{ env.VERSION }}.zip"
          ditto -c -k --sequesterRsrc --keepParent HaloX.app "${{ matrix.artifact }}-v${{ env.VERSION }}.zip"
          echo "PKG_FILE=${{ matrix.artifact }}-v${{ env.VERSION }}.zip" >> "$GITHUB_ENV"

      - name: Package Linux wrapper
        if: runner.os == 'Linux'
        run: |
          rm -f "${{ matrix.artifact }}-v${{ env.VERSION }}.tar.gz"
          tar -czf "${{ matrix.artifact }}-v${{ env.VERSION }}.tar.gz" -C dist HaloX
          echo "PKG_FILE=${{ matrix.artifact }}-v${{ env.VERSION }}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> the artifact is served as-is, so downloading
          # the artifact gives a single file (the .zip with HaloX.app, or the
          # .tar.gz with the Linux wrapper dir) – no nested archive.
          path: ${{ env.PKG_FILE }}
          archive: false
