name: Publish project release

# Manual trigger only. Publishes the *project* (source + build scripts) as a
# GitHub Release so users can download a ZIP and build HaloX locally. It never
# publishes the built HaloX.app artifacts - those are produced as run artifacts
# by build-wrapper.yml and are intentionally not released.
on:
  workflow_dispatch:

# Required to create the tag and the release.
permissions:
  contents: write

# Never run two publishes at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CHANGELOG
        run: |
          # Single source of truth: the topmost "## [x.y.z]" heading.
          VERSION="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from CHANGELOG.md (expected a '## [x.y.z]' heading)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists - refusing to overwrite."
            exit 1
          fi

      - name: Build release notes from CHANGELOG
        run: |
          {
            echo "> See README.md for build instructions."
            echo
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md
          } > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Build project ZIP
        run: |
          git archive --format=zip \
            --prefix="HaloX-$VERSION/" \
            -o "HaloX-builder-v$VERSION.zip" HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --title "HaloX $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            "HaloX-builder-v$VERSION.zip"
